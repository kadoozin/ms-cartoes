spring:
  cloud:
    service-registry:
      auto-registration:
        enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  datasource:
    url: jdbc:h2:mem:cartoesdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    readinessstate:
      enabled: true

server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin-eureka-username:admin-eureka-password@eureka-server:8761/eureka
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

mq:
  exchange: cartoes.ex
  queues:
    emissao-cartoes: emissao-cartoes

rabbitmq:
  exchange:
    cliente: cliente.exchange
  queue:
    cliente-criado: cliente.criado.ms-cartoes.queue
  routing-key:
    cliente-criado: cliente.criado.rk